[project]
name = "testfinance"
version = "0.1.0"
description = "Python-сервис для анализа личных финансов"
authors = [
    {name = "Evgeniy Semin",email = "evgeniy.zhenia@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "greenlet (>=3.5.5,<4.0.0)",
    "fastapi (>=0.115)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "pydantic-settings (>=2.0)",
    "pyjwt (>=2.9)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "httpx (>=0.28.1,<0.29.0)"
]
